<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitFlex — Live Session</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { overflow: hidden; }

    /* ── Full-screen dashboard layout ── */
    .dashboard {
      display: grid;
      grid-template-rows: 60px 1fr 80px;
      height: 100vh;
      width: 100vw;
    }

    /* TOP BAR */
    .top-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px;
      background: rgba(8,12,16,.95);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }
    .top-bar-left { display: flex; align-items: center; gap: 20px; }
    .logo { font-family: var(--font-hero); font-size: 22px; color: var(--green); letter-spacing: 2px; }
    .logo span { color: var(--cyan); }
    .exercise-badge {
      background: rgba(0,255,136,.1); border: 1px solid rgba(0,255,136,.25);
      color: var(--green); font-size: 12px; font-weight: 600; letter-spacing: 2px;
      padding: 4px 12px; border-radius: 20px; text-transform: uppercase;
    }
    .status-pill {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: var(--muted); font-family: var(--font-mono); letter-spacing: 1px;
    }
    .timer {
      font-family: var(--font-mono); font-size: 20px; font-weight: 500;
      color: var(--cyan); letter-spacing: 3px;
    }

    /* MAIN CONTENT */
    .main-content {
      display: grid;
      grid-template-columns: 1fr 300px;
      overflow: hidden;
    }

    /* VIDEO PANEL */
    .video-panel {
      position: relative; background: #000; overflow: hidden;
    }
    #cameraFeed {
      width: 100%; height: 100%; object-fit: cover;
      display: block;
    }
    .video-offline {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; color: var(--muted);
    }
    .video-offline .icon { font-size: 64px; }
    .video-offline p { font-size: 14px; letter-spacing: 1px; }

    /* Video overlay — stats in corner */
    .video-overlay {
      position: absolute; top: 20px; right: 20px;
      display: flex; flex-direction: column; gap: 10px;
      pointer-events: none;
    }
    .overlay-chip {
      background: rgba(8,12,16,.85);
      border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 14px;
      font-family: var(--font-mono); font-size: 13px;
      backdrop-filter: blur(8px);
      min-width: 120px;
    }
    .overlay-chip .oc-label { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
    .overlay-chip .oc-val   { font-size: 18px; font-weight: 500; margin-top: 2px; }

    /* SIDEBAR */
    .sidebar {
      background: var(--bg-2);
      border-left: 1px solid var(--border);
      display: flex; flex-direction: column;
      overflow-y: auto;
    }
    .sidebar-section {
      padding: 20px; border-bottom: 1px solid var(--border);
    }
    .sidebar-section:last-child { border-bottom: none; }
    .sidebar-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }

    /* Big rep counter */
    .rep-counter {
      text-align: center; padding: 28px 20px;
      border-bottom: 1px solid var(--border);
    }
    .rep-number {
      font-family: var(--font-mono); font-size: 96px; font-weight: 500;
      line-height: 1; color: var(--green);
      transition: transform .15s;
    }
    .rep-number.bump { transform: scale(1.1); color: #fff; }
    .rep-label { font-size: 11px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; margin-top: 8px; }

    /* Mini stat row */
    .mini-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); }
    .mini-stat {
      background: var(--bg-2);
      padding: 16px 14px; text-align: center;
    }
    .mini-stat .ms-val { font-family: var(--font-mono); font-size: 22px; font-weight: 500; }
    .mini-stat .ms-lbl { font-size: 10px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-top: 4px; }

    /* Angle gauge */
    .angle-gauge-wrap { padding: 20px; border-bottom: 1px solid var(--border); }
    .angle-bar-bg {
      height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; margin: 12px 0;
    }
    .angle-bar-fill {
      height: 100%; background: linear-gradient(90deg, var(--cyan), var(--green));
      border-radius: 4px; transition: width .3s;
    }
    .angle-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-family: var(--font-mono); }

    /* AI feedback */
    .ai-feedback {
      padding: 20px;
      flex: 1;
    }
    .feedback-box {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px;
      font-size: 14px; font-weight: 600; letter-spacing: .5px;
      min-height: 56px; display: flex; align-items: center; justify-content: center;
      text-align: center; line-height: 1.5;
      transition: all .3s;
    }

    /* BOTTOM BAR */
    .bottom-bar {
      display: flex; align-items: center; justify-content: center; gap: 16px;
      background: rgba(8,12,16,.95);
      border-top: 1px solid var(--border);
      padding: 0 24px;
    }

    /* INVALID overlay flash */
    .video-panel.invalid-flash {
      animation: border-flash .4s;
    }
    @keyframes border-flash {
      0%,100% { box-shadow: none; }
      50% { box-shadow: inset 0 0 0 3px var(--red); }
    }

    @media (max-width: 900px) {
      .main-content { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      body { overflow: auto; }
      .dashboard { height: auto; }
    }
  </style>
</head>
<body>

<div class="dashboard">

  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="top-bar-left">
      <div class="logo">FIT<span>FLEX</span></div>
      <div class="exercise-badge" id="exerciseLabel">Bicep Curl</div>
      <div class="status-pill">
        <span class="dot dot-offline" id="statusDot"></span>
        <span id="statusText">Connecting…</span>
      </div>
    </div>
    <div class="timer" id="timerDisplay">00:00</div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main-content">

    <!-- Video -->
    <div class="video-panel" id="videoPanel">
      <img id="cameraFeed" src="" alt="Live Feed" style="display:none" />
      <div class="video-offline" id="videoOffline">
        <div class="icon">📷</div>
        <p>Waiting for video stream…</p>
      </div>

      <!-- Overlay chips -->
      <div class="video-overlay" id="videoOverlay" style="display:none">
        <div class="overlay-chip">
          <div class="oc-label">Angle</div>
          <div class="oc-val" id="overlayAngle">—°</div>
        </div>
        <div class="overlay-chip">
          <div class="oc-label">Form</div>
          <div class="oc-val" id="overlayForm">—</div>
        </div>
        <div class="overlay-chip">
          <div class="oc-label">Confidence</div>
          <div class="oc-val" id="overlayConf">—</div>
        </div>
      </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">

      <!-- Reps -->
      <div class="rep-counter">
        <div class="rep-number" id="repDisplay">0</div>
        <div class="rep-label">Reps Completed</div>
      </div>

      <!-- Mini stats -->
      <div class="mini-stats">
        <div class="mini-stat">
          <div class="ms-val" id="setDisplay">1</div>
          <div class="ms-lbl">Set</div>
        </div>
        <div class="mini-stat">
          <div class="ms-val" id="angleDisplay">—</div>
          <div class="ms-lbl">Angle</div>
        </div>
        <div class="mini-stat">
          <div class="ms-val" id="confDisplay">—</div>
          <div class="ms-lbl">Conf %</div>
        </div>
        <div class="mini-stat">
          <div class="ms-val" id="stateDisplay">—</div>
          <div class="ms-lbl">Phase</div>
        </div>
      </div>

      <!-- Angle gauge -->
      <div class="angle-gauge-wrap">
        <div class="sidebar-label">Elbow Angle</div>
        <div class="angle-bar-bg">
          <div class="angle-bar-fill" id="angleBar" style="width:0%"></div>
        </div>
        <div class="angle-labels">
          <span>0°</span>
          <span id="angleCurrent">—</span>
          <span>180°</span>
        </div>
      </div>

      <!-- AI Feedback -->
      <div class="ai-feedback">
        <div class="sidebar-label">AI Coach</div>
        <div class="feedback-box" id="feedbackBox">Waiting for pose detection…</div>
      </div>

    </div>
  </div>

  <!-- BOTTOM BAR -->
  <div class="bottom-bar">
    <button class="btn btn-ghost" onclick="goBack()">← Back</button>
    <button class="btn btn-danger" onclick="stopWorkout()">⏹ End Session</button>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
