<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitFlex — History</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .history-header {
      display: flex; align-items: flex-end; justify-content: space-between;
      margin-bottom: 32px; flex-wrap: wrap; gap: 16px;
    }
    .history-header h1 { font-family: var(--font-hero); font-size: 52px; letter-spacing: 3px; }
    .history-header p { color: var(--muted); font-size: 14px; margin-top: 4px; }

    /* Summary stats */
    .hist-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; margin-bottom: 40px; }
    .hist-stat {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 24px; text-align: center;
    }
    .hist-stat .num { font-family: var(--font-mono); font-size: 40px; color: var(--green); }
    .hist-stat .lbl { font-size: 11px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-top: 8px; }

    /* Filters */
    .filters {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px 20px;
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .filters label { font-size: 11px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
    .filters select, .filters input { width: auto; }

    /* Table card */
    .table-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
    }
    .table-empty {
      text-align: center; padding: 60px; color: var(--muted);
    }
    .table-empty .icon { font-size: 48px; margin-bottom: 16px; }
    .table-empty p { font-size: 14px; }

    tbody tr:hover { background: rgba(0,255,136,.03); cursor: pointer; }
    .ex-pill {
      display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600;
      background: rgba(0,212,255,.1); color: var(--cyan); border: 1px solid rgba(0,212,255,.2);
    }

    .load-more { text-align: center; margin-top: 24px; }

    @media (max-width: 768px) {
      .hist-stats { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <div class="nav-logo"><a href="index.html">FIT<span>FLEX</span></a></div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="exercises.html">Train</a>
      <a href="history.html" class="active">History</a>
    </div>
  </div>
</nav>

<div class="page">
  <div class="container">

    <div class="history-header">
      <div>
        <h1>HISTORY</h1>
        <p>All completed workout sessions</p>
      </div>
      <a href="exercises.html" class="btn btn-primary">▶ New Session</a>
    </div>

    <!-- Stats row -->
    <div class="hist-stats">
      <div class="hist-stat">
        <div class="num" id="hs_workouts">0</div>
        <div class="lbl">Total Workouts</div>
      </div>
      <div class="hist-stat">
        <div class="num" id="hs_reps">0</div>
        <div class="lbl">Total Reps</div>
      </div>
      <div class="hist-stat">
        <div class="num" id="hs_time">0</div>
        <div class="lbl">Total Minutes</div>
      </div>
    </div>

    <!-- Filters -->
    <div class="filters">
      <label>Filter</label>
      <select id="filterExercise" onchange="renderTable()">
        <option value="">All Exercises</option>
        <option value="bicep_curl">Bicep Curl</option>
      </select>
      <input type="text" id="filterUser" placeholder="Filter by user…" oninput="renderTable()" style="max-width:180px" />
    </div>

    <!-- Table -->
    <div class="table-card">
      <table id="historyTable">
        <thead>
          <tr>
            <th>#</th>
            <th>Date</th>
            <th>User</th>
            <th>Exercise</th>
            <th>Reps</th>
            <th>Duration</th>
          </tr>
        </thead>
        <tbody id="historyBody">
          <tr>
            <td colspan="6">
              <div class="table-empty">
                <div class="icon">⏳</div>
                <p>Loading sessions…</p>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>
</div>

<script>
  const API = 'http://localhost:8765';
  let allSessions = [];

  function fmtDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' }) +
           ' ' + d.toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit' });
  }

  function fmtDur(secs) {
    if (!secs) return '—';
    const m = Math.floor(secs/60), s = Math.round(secs%60);
    return m > 0 ? `${m}m ${s}s` : `${s}s`;
  }

  function renderTable() {
    const exFilter   = document.getElementById('filterExercise').value;
    const userFilter = document.getElementById('filterUser').value.trim().toLowerCase();

    const filtered = allSessions.filter(s => {
      if (exFilter && s.exercise !== exFilter) return false;
      if (userFilter && !(s.user_id||'').toLowerCase().includes(userFilter)) return false;
      return true;
    });

    const tbody = document.getElementById('historyBody');
    if (filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6"><div class="table-empty"><div class="icon">🏋️</div><p>No sessions found. <a href="exercises.html" style="color:var(--green)">Start your first workout →</a></p></div></td></tr>`;
      return;
    }

    tbody.innerHTML = filtered.map((s, i) => `
      <tr>
        <td class="mono" style="color:var(--muted)">${s.session_id}</td>
        <td>${fmtDate(s.start_time)}</td>
        <td>${s.user_id || '—'}</td>
        <td><span class="ex-pill">${(s.exercise||'').replace('_',' ')}</span></td>
        <td class="mono" style="color:var(--green);font-weight:500">${s.total_reps}</td>
        <td class="mono">${fmtDur(s.duration_seconds)}</td>
      </tr>
    `).join('');
  }

  async function loadHistory() {
    try {
      const res = await fetch(`${API}/sessions`);
      allSessions = await res.json();

      // Stats
      const totalReps  = allSessions.reduce((a,s) => a + (s.total_reps||0), 0);
      const totalMins  = Math.round(allSessions.reduce((a,s) => a + (s.duration_seconds||0), 0) / 60);
      document.getElementById('hs_workouts').textContent = allSessions.length;
      document.getElementById('hs_reps').textContent     = totalReps;
      document.getElementById('hs_time').textContent     = totalMins;

      renderTable();
    } catch (e) {
      document.getElementById('historyBody').innerHTML =
        `<tr><td colspan="6"><div class="table-empty"><div class="icon">⚠️</div><p>Could not reach backend. Is it running on port 8765?</p></div></td></tr>`;
    }
  }

  loadHistory();
</script>
</body>
</html>
