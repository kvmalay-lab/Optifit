<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitFlex — Session Summary</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .summary-hero {
      text-align: center; padding: 60px 0 48px;
      border-bottom: 1px solid var(--border); margin-bottom: 48px;
    }
    .summary-hero .trophy { font-size: 72px; margin-bottom: 20px; }
    .summary-hero h1 { font-family: var(--font-hero); font-size: 52px; letter-spacing: 3px; color: var(--green); }
    .summary-hero p { color: var(--muted); margin-top: 8px; font-size: 15px; }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 16px; margin-bottom: 40px;
    }
    .sum-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 28px 20px; text-align: center;
    }
    .sum-card .num {
      font-family: var(--font-mono); font-size: 48px; font-weight: 500;
      color: var(--green); line-height: 1;
    }
    .sum-card .lbl {
      font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
      color: var(--muted); margin-top: 10px;
    }

    .sum-detail {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 28px; margin-bottom: 24px;
    }
    .sum-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 0; border-bottom: 1px solid rgba(31,45,61,.5);
      font-size: 14px;
    }
    .sum-row:last-child { border-bottom: none; }
    .sum-row .key { color: var(--muted); }
    .sum-row .val { font-family: var(--font-mono); font-weight: 500; }

    .action-bar { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-top: 40px; }

    @media (max-width: 768px) {
      .summary-grid { grid-template-columns: repeat(2,1fr); }
    }
  </style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <div class="nav-logo"><a href="index.html">FIT<span>FLEX</span></a></div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="exercises.html">Train</a>
      <a href="history.html">History</a>
    </div>
  </div>
</nav>

<div class="page">
  <div class="container" style="max-width:860px">

    <div class="summary-hero">
      <div class="trophy">🏆</div>
      <h1>SESSION COMPLETE</h1>
      <p id="summarySubtitle">Great work! Here's how you did.</p>
    </div>

    <!-- Big stats -->
    <div class="summary-grid">
      <div class="sum-card">
        <div class="num" id="s_reps">—</div>
        <div class="lbl">Total Reps</div>
      </div>
      <div class="sum-card">
        <div class="num" id="s_duration">—</div>
        <div class="lbl">Duration (sec)</div>
      </div>
      <div class="sum-card">
        <div class="num" id="s_sets">—</div>
        <div class="lbl">Sets</div>
      </div>
      <div class="sum-card">
        <div class="num" id="s_id">—</div>
        <div class="lbl">Session ID</div>
      </div>
    </div>

    <!-- Details -->
    <div class="sum-detail">
      <p class="section-title">Details</p>
      <div class="sum-row">
        <span class="key">Exercise</span>
        <span class="val" id="s_exercise">—</span>
      </div>
      <div class="sum-row">
        <span class="key">User ID</span>
        <span class="val" id="s_user">—</span>
      </div>
      <div class="sum-row">
        <span class="key">Total Reps</span>
        <span class="val" id="s_reps2">—</span>
      </div>
      <div class="sum-row">
        <span class="key">Duration</span>
        <span class="val" id="s_dur2">—</span>
      </div>
    </div>

    <!-- Actions -->
    <div class="action-bar">
      <a href="exercises.html" class="btn btn-primary btn-lg">▶ New Session</a>
      <a href="history.html" class="btn btn-secondary">View History</a>
      <a href="index.html" class="btn btn-ghost">Home</a>
    </div>

  </div>
</div>

<script>
  function formatDuration(secs) {
    const m = Math.floor(secs / 60);
    const s = Math.round(secs % 60);
    return m > 0 ? `${m}m ${s}s` : `${s}s`;
  }

  const raw = localStorage.getItem('lastSummary');
  if (raw) {
    try {
      const d = JSON.parse(raw);
      document.getElementById('s_reps').textContent    = d.total_reps ?? '—';
      document.getElementById('s_reps2').textContent   = d.total_reps ?? '—';
      document.getElementById('s_duration').textContent = d.duration_seconds ?? '—';
      document.getElementById('s_dur2').textContent    = formatDuration(d.duration_seconds ?? 0);
      document.getElementById('s_sets').textContent    = '1';
      document.getElementById('s_id').textContent      = d.session_id ?? '—';
      document.getElementById('s_exercise').textContent = (d.exercise || '—').replace('_',' ').toUpperCase();
      document.getElementById('s_user').textContent    = d.user_id ?? '—';
      document.getElementById('summarySubtitle').textContent =
        `Great work, ${d.user_id}! Here's how you did.`;
    } catch {/* ignore */}
  }
</script>
</body>
</html>
